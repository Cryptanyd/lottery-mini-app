<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>TON Lottery — Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A121C;
    --bg-glow: radial-gradient(circle at 50% -10%, rgba(0,152,234,.16) 0%, transparent 55%);
    --surface:#111C29;
    --surface-2:#16233370;
    --line:#1E2C3D;
    --blue:#2E9BFF;
    --blue-2:#6FCEFF;
    --gold:#FFC855;
    --text:#EAF2FA;
    --muted:#7E93AC;
    --danger:#F0666E;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; background:var(--bg-glow), var(--bg);
    color:var(--text); font-family:var(--font-body);
    display:flex; justify-content:center;
    padding:20px 14px 48px;
  }
  .app{ width:100%; max-width:460px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:600; font-size:16px; letter-spacing:.01em; }
  .brand-mark{ width:22px; height:22px; }
  .wallet-chip{
    display:flex; align-items:center; gap:7px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:99px; padding:7px 12px; font-size:12.5px;
    font-family:var(--font-mono); color:var(--muted); cursor:pointer;
  }
  .wallet-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .wallet-chip.connected .dot{ background:#4FD1A5; box-shadow:0 0 0 3px #4fd1a51f; }
  .wallet-chip.connected{ color:var(--text); }

  .hero{
    background:linear-gradient(180deg, var(--surface) 0%, #0D1826 100%);
    border:1px solid var(--line); border-radius:22px;
    padding:26px 20px 22px; text-align:center; position:relative; overflow:hidden;
  }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .eyebrow b{ color:var(--blue-2); font-weight:500; }

  .gauge-wrap{ position:relative; width:190px; height:190px; margin:18px auto 6px; }
  .gauge-wrap svg{ width:100%; height:100%; }
  .gauge-fill{ transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
  .gauge-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .gauge-pot{ font-family:var(--font-display); font-weight:700; font-size:30px; line-height:1; }
  .gauge-pot span{ font-size:14px; font-weight:500; color:var(--muted); margin-left:3px; }
  .gauge-count{ font-family:var(--font-mono); font-size:13px; color:var(--blue-2); margin-top:6px; }

  .split-rows{ display:flex; gap:10px; margin-top:18px; }
  .split{
    flex:1; background:var(--surface-2); border:1px solid var(--line);
    border-radius:14px; padding:12px 10px; text-align:center;
  }
  .split .num{ font-family:var(--font-display); font-weight:600; font-size:17px; }
  .split .lbl{ font-size:11px; color:var(--muted); margin-top:2px; }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:14px; margin:26px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }

  .cabinet{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px;
  }
  .cabinet-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; }
  .cabinet-row + .cabinet-row{ border-top:1px solid var(--line); }
  .cabinet-row .k{ font-size:13.5px; color:var(--muted); }
  .cabinet-row .v{ font-size:13.5px; font-weight:500; font-family:var(--font-mono); }
  .status-pill{ font-size:12px; padding:3px 10px; border-radius:99px; font-family:var(--font-body); font-weight:500; }
  .status-pill.in{ background:#4fd1a51f; color:#4FD1A5; }
  .status-pill.out{ background:#7e93ac1f; color:var(--muted); }

  .buy-btn{
    width:100%; margin-top:16px; padding:16px; border:none; border-radius:14px;
    font-family:var(--font-display); font-size:15.5px; font-weight:600; cursor:pointer;
    background:linear-gradient(135deg, var(--blue) 0%, var(--blue-2) 100%); color:#04131F;
  }
  .buy-btn:disabled{ background:#1B2938; color:var(--muted); cursor:not-allowed; }
  #ton-connect-root{ margin-top:4px; }
  #ton-connect-root button{ width:100% !important; }

  .status-msg{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:10px; min-height:16px; }
  .status-msg.err{ color:var(--danger); }
  .status-msg.ok{ color:#4FD1A5; }

  .winners{ display:flex; flex-direction:column; gap:8px; }
  .winner-row{
    display:flex; align-items:center; gap:11px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
  }
  .winner-icon{
    width:30px; height:30px; border-radius:9px; flex-shrink:0;
    background:linear-gradient(135deg,var(--gold),#C98A2C); display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .winner-main{ flex:1; min-width:0; }
  .winner-addr{ font-family:var(--font-mono); font-size:12.5px; }
  .winner-round{ font-size:11px; color:var(--muted); margin-top:1px; }
  .winner-amount{ font-family:var(--font-display); font-weight:600; font-size:14px; color:var(--gold); white-space:nowrap; }
  .empty-note{ text-align:center; color:var(--muted); font-size:12.5px; padding:16px 0; }

  .footer-note{ text-align:center; font-size:11px; color:var(--muted); margin-top:26px; line-height:1.6; }
  .footer-note a{ color:var(--blue-2); text-decoration:none; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2L36 12V28L20 38L4 28V12L20 2Z" fill="url(#g1)"/>
        <defs><linearGradient id="g1" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6FCEFF"/><stop offset="1" stop-color="#2E9BFF"/>
        </linearGradient></defs>
      </svg>
      TON Lottery
    </div>
    <div class="wallet-chip" id="wallet-chip">
      <span class="dot"></span><span id="wallet-chip-text">Не подключён</span>
    </div>
  </div>

  <div class="hero">
    <div class="eyebrow">Раунд <b id="round-id">—</b></div>
    <div class="gauge-wrap">
      <svg viewBox="0 0 190 190">
        <defs>
          <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6FCEFF"/>
            <stop offset="100%" stop-color="#2E9BFF"/>
          </linearGradient>
        </defs>
        <polygon points="95,10 160,50 160,140 95,180 30,140 30,50"
          fill="none" stroke="#1E2C3D" stroke-width="10" stroke-linejoin="round"/>
        <polygon id="gauge-fill" points="95,10 160,50 160,140 95,180 30,140 30,50"
          fill="none" stroke="url(#gaugeGrad)" stroke-width="10" stroke-linejoin="round"
          stroke-dasharray="504" stroke-dashoffset="504" class="gauge-fill"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-pot" id="pot-amount">0<span>TON</span></div>
        <div class="gauge-count"><span id="players">0</span>/<span id="max-players">100</span> билетов</div>
      </div>
    </div>

    <div class="split-rows">
      <div class="split"><div class="num" id="ticket-price">1 TON</div><div class="lbl">билет</div></div>
      <div class="split"><div class="num">90%</div><div class="lbl">победителю</div></div>
      <div class="split"><div class="num">10%</div><div class="lbl">организатору</div></div>
    </div>
  </div>

  <div class="section-title">Мой кабинет</div>
  <div class="cabinet">
    <div class="cabinet-row">
      <div class="k">Статус участия</div>
      <div class="v"><span class="status-pill out" id="participation-status">Не участвуете</span></div>
    </div>
    <div class="cabinet-row">
      <div class="k">Ваши билеты</div>
      <div class="v" id="my-tickets">0</div>
    </div>
    <div class="cabinet-row">
      <div class="k">Вероятность победы</div>
      <div class="v" id="win-chance">0%</div>
    </div>
  </div>

  <div id="ton-connect-root"></div>
  <button id="buy-btn" class="buy-btn" disabled>Купить билет</button>
  <div id="status-msg" class="status-msg"></div>

  <div class="section-title">История победителей</div>
  <div class="winners" id="winners-list">
    <div class="empty-note">Пока нет завершённых раундов</div>
  </div>

  <div class="footer-note">
    Контракт: <a href="https://tonviewer.com/EQD0NvW_RbNI7Y4vt0U_c1bdL8xfqMEoSUKvGZ0tKxmvRhD6" target="_blank">Tonviewer</a><br>
    Призовой фонд формируется из ставок участников
  </div>

</div>

<script>
  // ============================================================
  // КОНФИГУРАЦИЯ
  // ============================================================
  const CONTRACT_ADDRESS = 'EQD0NvW_RbNI7Y4vt0U_c1bdL8xfqMEoSUKvGZ0tKxmvRhD6';
  const APP_URL = 'https://cryptanyd.github.io/lottery-mini-app';
  const TONCENTER_API = 'https://integrate.api.nvidia.com/v1';
  const TONCENTER_API_KEY = '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';
  
  // Минимальная сумма для участия = 1 TON (в нанотонах)
  const MIN_TICKET_PRICE_NANO = 1000000000n; // 1 TON = 10^9 нанотон

  // ============================================================
  // СОСТОЯНИЕ
  // ============================================================
  let tonConnectUI = null;
  let wallet = null;
  let lotteryData = { 
    playersCount: 0, 
    ticketPrice: MIN_TICKET_PRICE_NANO, 
    maxPlayers: 100, 
    roundId: 0,
    prizePool: 0n
  };

  // ============================================================
  // УТИЛИТЫ
  // ============================================================
  
  // Форматирование нанотон → TON (строка)
  function formatTon(nanoTon) {
    if (typeof nanoTon === 'bigint') {
      const ton = Number(nanoTon) / 1e9;
      return ton.toFixed(ton % 1 === 0 ? 0 : 2);
    }
    if (typeof nanoTon === 'number') {
      return (nanoTon / 1e9).toFixed(nanoTon % 1e9 === 0 ? 0 : 2);
    }
    return '0';
  }

  // Парсинг числа из стека TonCenter (поддерживает разные форматы)
  function parseStackNumber(item) {
    if (!item) return 0;
    
    // Формат 1: ["num", "0x123abc"] или ["int", "0x123abc"]
    if (Array.isArray(item) && item.length >= 2) {
      const type = item[0];
      const value = item[1];
      
      if (type === 'num' || type === 'int') {
        // Может быть hex строка или число
        if (typeof value === 'string') {
          if (value.startsWith('0x') || value.startsWith('-0x')) {
            return parseInt(value, 16);
          }
          return parseInt(value, 10);
        }
        if (typeof value === 'number') return value;
        if (typeof value === 'bigint') return Number(value);
      }
      
      // Формат 2: ["num", { "number": "123" }]
      if (typeof value === 'object' && value !== null) {
        if (value.number) return parseInt(value.number, 10);
        if (value.value) return parseInt(value.value, 10);
      }
    }
    
    // Формат 3: просто число
    if (typeof item === 'number') return item;
    if (typeof item === 'bigint') return Number(item);
    if (typeof item === 'string') {
      if (item.startsWith('0x')) return parseInt(item, 16);
      return parseInt(item, 10);
    }
    
    console.warn('Неизвестный формат стека:', item);
    return 0;
  }

  // Парсинг BigInt из стека
  function parseStackBigInt(item) {
    const num = parseStackNumber(item);
    return BigInt(num);
  }

  // Показать статусное сообщение
  function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg ' + (type || '');
  }

  // ============================================================
  // TON CONNECT
  // ============================================================
  
  async function initTonConnect() {
    try {
      tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: `${APP_URL}/tonconnect-manifest.json`,
        buttonRootId: 'ton-connect-root'
      });

      tonConnectUI.onStatusChange((w) => {
        wallet = w;
        updateWalletUI();
        if (wallet) checkParticipation();
      });

      // Проверяем сохранённое подключение
      const restored = await tonConnectUI.connectionRestored;
      if (restored && tonConnectUI.wallet) {
        wallet = tonConnectUI.wallet;
        updateWalletUI();
        checkParticipation();
      }
    } catch (e) {
      console.error('TON Connect init error:', e);
      showStatus('Ошибка инициализации кошелька', 'err');
    }
  }

  function updateWalletUI() {
    const chip = document.getElementById('wallet-chip');
    const text = document.getElementById('wallet-chip-text');
    const buyBtn = document.getElementById('buy-btn');

    if (wallet && wallet.account) {
      chip.classList.add('connected');
      const addr = wallet.account.address;
      text.textContent = addr.slice(0, 6) + '...' + addr.slice(-4);
      buyBtn.disabled = false;
      buyBtn.textContent = 'Купить билет (' + formatTon(lotteryData.ticketPrice) + ' TON)';
    } else {
      chip.classList.remove('connected');
      text.textContent = 'Не подключён';
      buyBtn.disabled = true;
      buyBtn.textContent = 'Купить билет';
    }
  }

  // ============================================================
  // API TONCENTER
  // ============================================================
  
  async function callContractMethod(method, params = []) {
    const response = await fetch(TONCENTER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: Date.now(),
        method: 'runGetMethod',
        params: {
          address: CONTRACT_ADDRESS,
          method: method,
          stack: params
        }
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();
    
    console.log(`TonCenter response for ${method}:`, data);
    
    if (data.error) {
      throw new Error(data.error.message || `TonCenter error: ${JSON.stringify(data.error)}`);
    }

    if (!data.result) {
      throw new Error('Empty result from TonCenter');
    }

    return data.result;
  }

  // ============================================================
  // ЧТЕНИЕ ДАННЫХ ЛОТЕРЕИ
  // ============================================================
  
  async function updateLotteryData() {
    try {
      showStatus('Загрузка данных...', '');
      
      console.log('Fetching lottery data...');

      const result = await callContractMethod('get_lottery_data');
      
      console.log('Raw TonCenter result:', JSON.stringify(result, null, 2));

      // Проверяем наличие стека
      if (!result.stack || !Array.isArray(result.stack)) {
        throw new Error('Response missing stack array. Got: ' + JSON.stringify(result));
      }

      const stack = result.stack;
      console.log('Stack length:', stack.length);
      console.log('Stack items:', stack);

      // Ожидаем 5 элементов: playersCount, ownerAddress, roundId, ticketPrice, maxPlayers
      if (stack.length < 5) {
        throw new Error(`Invalid response stack: expected 5 items, got ${stack.length}. Stack: ${JSON.stringify(stack)}`);
      }

      // Парсим данные (индексы 0-4 по порядку контракта)
      lotteryData.playersCount = parseStackNumber(stack[0]);
      // stack[1] = ownerAddress (пропускаем, не нужен для UI)
      lotteryData.roundId = parseStackNumber(stack[2]);
      lotteryData.ticketPrice = parseStackBigInt(stack[3]);
      lotteryData.maxPlayers = parseStackNumber(stack[4]);

      console.log('Parsed lottery data:', {
        playersCount: lotteryData.playersCount,
        roundId: lotteryData.roundId,
        ticketPrice: lotteryData.ticketPrice.toString(),
        maxPlayers: lotteryData.maxPlayers
      });

      // ПРОВЕРКА: минимальная цена билета = 1 TON
      if (lotteryData.ticketPrice < MIN_TICKET_PRICE_NANO) {
        console.warn('Ticket price from contract is less than minimum:', lotteryData.ticketPrice.toString());
        lotteryData.ticketPrice = MIN_TICKET_PRICE_NANO;
      }

      // Призовой фонд = playersCount * ticketPrice * 90% (90% идёт победителю)
      lotteryData.prizePool = BigInt(lotteryData.playersCount) * lotteryData.ticketPrice * 90n / 100n;

      // Обновляем UI
      document.getElementById('players').textContent = lotteryData.playersCount;
      document.getElementById('max-players').textContent = lotteryData.maxPlayers;
      document.getElementById('round-id').textContent = '#' + lotteryData.roundId;
      document.getElementById('pot-amount').innerHTML = formatTon(lotteryData.prizePool) + '<span>TON</span>';
      document.getElementById('ticket-price').textContent = formatTon(lotteryData.ticketPrice) + ' TON';

      // Обновляем график заполнения
      updateGauge(lotteryData.playersCount, lotteryData.maxPlayers);

      // Обновляем кнопку покупки
      if (wallet) {
        updateWalletUI();
        await checkParticipation();
      }

      showStatus('', '');
    } catch (e) {
      console.error('Update lottery data error:', e);
      showStatus('Ошибка загрузки данных: ' + e.message, 'err');
    }
  }

  function updateGauge(current, max) {
    const fill = document.getElementById('gauge-fill');
    const percent = max > 0 ? Math.min(current / max, 1) : 0;
    const offset = 504 - (504 * percent);
    fill.style.strokeDashoffset = offset;
  }

  // ============================================================
  // ПРОВЕРКА УЧАСТИЯ
  // ============================================================
  
  async function checkParticipation() {
    if (!wallet || !wallet.account) {
      document.getElementById('participation-status').textContent = 'Не участвуете';
      document.getElementById('participation-status').className = 'status-pill out';
      document.getElementById('my-tickets').textContent = '0';
      document.getElementById('win-chance').textContent = '0%';
      return;
    }

    try {
      const addr = wallet.account.address;
      
      // Формируем параметр для get_is_participant
      // TonCenter ожидает stack item формата { type: 'slice', value: 'base64_boc' }
      // Но для простоты попробуем сначала с адресом как строкой
      const result = await callContractMethod('get_is_participant', [
        { type: 'slice', value: addr }
      ]);

      console.log('Participation check result:', result);

      const isParticipant = result.stack && result.stack.length > 0 && parseStackNumber(result.stack[0]) === 1;

      if (isParticipant) {
        document.getElementById('participation-status').textContent = 'Участвуете';
        document.getElementById('participation-status').className = 'status-pill in';
        document.getElementById('my-tickets').textContent = '1';
        const chance = lotteryData.maxPlayers > 0
          ? (100 / lotteryData.maxPlayers).toFixed(1)
          : '0';
        document.getElementById('win-chance').textContent = chance + '%';
      } else {
        document.getElementById('participation-status').textContent = 'Не участвуете';
        document.getElementById('participation-status').className = 'status-pill out';
        document.getElementById('my-tickets').textContent = '0';
        document.getElementById('win-chance').textContent = '0%';
      }
    } catch (e) {
      console.error('Check participation error:', e);
      // Не показываем ошибку пользователю, просто считаем что не участвует
      document.getElementById('participation-status').textContent = 'Не участвуете';
      document.getElementById('participation-status').className = 'status-pill out';
    }
  }

  // ============================================================
  // ПОКУПКА БИЛЕТА
  // ============================================================
  
  async function buyTicket() {
    if (!wallet || !wallet.account) {
      showStatus('Сначала подключите кошелёк Tonkeeper', 'err');
      return;
    }

    try {
      showStatus('Проверка данных...', '');

      // Перезагружаем данные перед покупкой
      await updateLotteryData();

      // ПРОВЕРКА 1: Не все ли билеты проданы?
      if (lotteryData.playersCount >= lotteryData.maxPlayers) {
        showStatus('Все билеты проданы! Ожидайте розыгрыша.', 'err');
        return;
      }

      // ПРОВЕРКА 2: Не участвует ли уже?
      const addr = wallet.account.address;
      const checkResult = await callContractMethod('get_is_participant', [
        { type: 'slice', value: addr }
      ]);
      const isParticipant = checkResult.stack && checkResult.stack.length > 0 && parseStackNumber(checkResult.stack[0]) === 1;

      if (isParticipant) {
        showStatus('Вы уже участвуете в этом раунде!', 'err');
        return;
      }

      // ПРОВЕРКА 3: Минимальная сумма = 1 TON
      // Используем цену из контракта, но не меньше 1 TON
      const ticketPrice = lotteryData.ticketPrice >= MIN_TICKET_PRICE_NANO 
        ? lotteryData.ticketPrice 
        : MIN_TICKET_PRICE_NANO;

      showStatus('Отправка транзакции в кошелёк...', '');

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600, // 10 минут на подтверждение
        messages: [{
          address: CONTRACT_ADDRESS,
          amount: ticketPrice.toString(), // Сумма в нанотонах (строка)
          payload: '' // Пустой payload — контракт обработает входящий TON
        }]
      };

      console.log('Sending transaction:', transaction);

      const txResult = await tonConnectUI.sendTransaction(transaction);
      console.log('Transaction result:', txResult);

      showStatus('Билет куплен! Удачи в розыгрыше!', 'ok');

      // Обновляем данные через 5 секунд (чтобы транзакция успела обработаться)
      setTimeout(() => {
        updateLotteryData();
        checkParticipation();
      }, 5000);
    } catch (e) {
      console.error('Buy ticket error:', e);
      
      // Разбираем тип ошибки
      const errorMsg = e.message || e.toString() || '';
      
      if (errorMsg.includes('Rejected') || errorMsg.includes('отменена') || errorMsg.includes('cancel')) {
        showStatus('Транзакция отменена пользователем', 'err');
      } else if (errorMsg.includes('insufficient') || errorMsg.includes('balance')) {
        showStatus('Недостаточно средств на кошельке', 'err');
      } else if (errorMsg.includes('timeout') || errorMsg.includes('timed out')) {
        showStatus('Время ожидания истекло, попробуйте снова', 'err');
      } else {
        showStatus('Ошибка покупки: ' + errorMsg, 'err');
      }
    }
  }

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
  // ============================================================
  
  document.addEventListener('DOMContentLoaded', () => {
    console.log('App initializing...');
    
    // Инициализируем Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      console.log('Telegram WebApp initialized');
    }

    // Инициализируем TON Connect
    initTonConnect();

    // Загружаем данные лотереи
    updateLotteryData();

    // Автообновление каждые 10 секунд
    setInterval(() => {
      updateLotteryData();
    }, 10000);

    // Обработчик кнопки покупки
    document.getElementById('buy-btn').addEventListener('click', buyTicket);
    
    console.log('App initialized successfully');
  });
</script>

</body>
</html>
